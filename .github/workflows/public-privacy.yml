name: Public release privacy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test stats/public-export.test.cjs
      - run: node --test stats/player-game-expansion.test.cjs stats/replay-awards.test.cjs stats/replay-telemetry.test.cjs
      - run: node --test stats/site-news.test.cjs stats/site-news-model.test.mjs
      - run: node --test stats/site-armory.test.cjs stats/site-armory-audio.test.cjs stats/site-armory-battle.test.cjs stats/site-armory-model.test.mjs stats/site-armory-units.test.mjs
      - run: node stats/check-public-release.cjs
