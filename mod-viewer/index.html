<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warzone 2100 Mod Viewer</title>
  <meta name="description" content="Open and compare Warzone 2100 mod archives and JSON stats in your browser.">
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071018;
      --panel: #0d1923;
      --panel-2: #111f2b;
      --line: #294252;
      --text: #e5f3fa;
      --muted: #8ea6b4;
      --cyan: #63d8f5;
      --green: #58d68d;
      --red: #ff7b79;
      --amber: #ffc866;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 80% 0, rgba(50, 143, 176, 0.15), transparent 34rem),
        linear-gradient(145deg, #050b10, var(--bg));
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--cyan); }

    .shell { width: min(1500px, calc(100% - 28px)); margin: 0 auto; padding: 22px 0 38px; }
    .topbar { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 40px); letter-spacing: 0.02em; }
    .subtitle { margin: 4px 0 0; color: var(--muted); }
    .home-link { white-space: nowrap; padding-top: 9px; text-decoration: none; }

    .loader-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .drop-zone {
      position: relative;
      min-height: 116px;
      display: grid;
      place-items: center;
      padding: 18px;
      border: 1px dashed #467084;
      border-radius: 15px;
      background: rgba(13, 25, 35, 0.8);
      text-align: center;
      transition: border-color 160ms, background 160ms;
    }
    .drop-zone.dragging { border-color: var(--cyan); background: rgba(32, 99, 121, 0.24); }
    .drop-zone input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .drop-zone strong { display: block; font-size: 17px; }
    .drop-zone span { display: block; margin-top: 6px; color: var(--muted); }
    .file-name { color: var(--cyan) !important; overflow-wrap: anywhere; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-items: center;
      margin: 16px 0 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(13, 25, 35, 0.86);
    }
    .search { flex: 1 1 260px; min-width: 0; }
    .search, .control {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #08131b;
      color: var(--text);
      padding: 8px 11px;
    }
    .control:hover { border-color: #4c778c; }
    .check { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); }
    .check input { accent-color: var(--cyan); }
    .status { margin-left: auto; color: var(--muted); }

    .tabs { display: flex; gap: 7px; overflow-x: auto; padding: 5px 0 10px; scrollbar-width: thin; }
    .tab {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      padding: 7px 13px;
    }
    .tab.active { border-color: var(--cyan); background: #123142; color: #fff; }

    .empty {
      margin-top: 12px;
      padding: 56px 20px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(13, 25, 35, 0.7);
      color: var(--muted);
      text-align: center;
    }
    .table-wrap { display: none; overflow: auto; max-height: calc(100vh - 330px); border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { position: sticky; top: 0; z-index: 1; background: #132430; color: #cfe7f2; text-align: left; }
    th, td { max-width: 360px; padding: 9px 11px; border-bottom: 1px solid #203744; vertical-align: top; overflow-wrap: anywhere; }
    tbody tr:hover { background: rgba(95, 200, 230, 0.07); }
    tbody tr { cursor: pointer; }
    .added td:first-child { box-shadow: inset 4px 0 var(--green); }
    .removed td:first-child { box-shadow: inset 4px 0 var(--red); }
    .changed td:first-child { box-shadow: inset 4px 0 var(--amber); }
    .old { color: var(--red); text-decoration: line-through; }
    .arrow { padding: 0 5px; color: var(--muted); }
    .new { color: var(--green); }

    dialog { width: min(850px, calc(100% - 28px)); max-height: 84vh; padding: 0; border: 1px solid #436a7d; border-radius: 15px; background: var(--panel-2); color: var(--text); box-shadow: 0 24px 80px #000b; }
    dialog::backdrop { background: #02070bd9; backdrop-filter: blur(3px); }
    .dialog-head { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
    .dialog-head h2 { margin: 0; font-size: 19px; }
    .dialog-body { padding: 16px; overflow: auto; }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: #cbe3ee; }
    .close { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 50%; background: #0a151d; color: #fff; }
    .error { color: #ffaaa8; }

    @media (max-width: 720px) {
      .shell { width: min(100% - 18px, 1500px); padding-top: 13px; }
      .topbar { gap: 8px; }
      .loader-grid { grid-template-columns: 1fr; }
      .drop-zone { min-height: 92px; }
      .status { width: 100%; margin-left: 0; }
      .table-wrap { max-height: calc(100vh - 390px); }
      th, td { min-width: 120px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>Warzone 2100 Mod Viewer</h1>
        <p class="subtitle">Open a <strong>.wz</strong>, <strong>.zip</strong>, <strong>.mod</strong>, or JSON file locally. Nothing is uploaded.</p>
      </div>
      <a class="home-link" href="../">← BOHA</a>
    </header>

    <section class="loader-grid" aria-label="Mod files">
      <label class="drop-zone" id="currentDrop">
        <input id="currentFile" type="file" accept=".wz,.zip,.mod,.json,application/zip,application/json">
        <span><strong>Open current mod</strong><span>Drop an archive here or click to browse</span><span class="file-name" id="currentName"></span></span>
      </label>
      <label class="drop-zone" id="baselineDrop">
        <input id="baselineFile" type="file" accept=".wz,.zip,.mod,.json,application/zip,application/json">
        <span><strong>Optional comparison mod</strong><span>Load an older/base version to highlight changes</span><span class="file-name" id="baselineName"></span></span>
      </label>
    </section>

    <section class="toolbar" aria-label="Viewer controls">
      <input class="search" id="search" type="search" placeholder="Search this table…" disabled>
      <button class="control" id="clearBaseline" type="button" disabled>Clear comparison</button>
      <label class="check"><input id="changesOnly" type="checkbox" disabled> Changes only</label>
      <span class="status" id="status">Choose a mod to begin.</span>
    </section>

    <nav class="tabs" id="tabs" aria-label="Data categories"></nav>
    <div class="empty" id="empty">The viewer reads JSON stats from Warzone 2100 mod archives and groups them into searchable tables.</div>
    <div class="table-wrap" id="tableWrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <dialog id="details">
    <div class="dialog-head">
      <h2 id="detailsTitle">Item details</h2>
      <button class="close" id="detailsClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="dialog-body"><pre id="detailsJson"></pre></div>
  </dialog>

  <script>
    (() => {
      const $ = (selector) => document.querySelector(selector);
      const currentFile = $('#currentFile');
      const baselineFile = $('#baselineFile');
      const currentName = $('#currentName');
      const baselineName = $('#baselineName');
      const clearBaseline = $('#clearBaseline');
      const changesOnly = $('#changesOnly');
      const search = $('#search');
      const status = $('#status');
      const tabs = $('#tabs');
      const empty = $('#empty');
      const tableWrap = $('#tableWrap');
      const thead = $('#thead');
      const tbody = $('#tbody');
      const details = $('#details');
      const detailsTitle = $('#detailsTitle');
      const detailsJson = $('#detailsJson');

      let currentData = new Map();
      let baselineData = new Map();
      let activeCategory = '';
      let renderedRows = [];

      const categoryNames = {
        weapon: 'Weapons', weapons: 'Weapons', body: 'Bodies', bodies: 'Bodies',
        propulsion: 'Propulsion', propulsions: 'Propulsion', structure: 'Structures', structures: 'Structures',
        research: 'Research', sensor: 'Sensors', sensors: 'Sensors', template: 'Templates', templates: 'Templates',
        feature: 'Features', features: 'Features', function: 'Functions', functions: 'Functions'
      };

      function cleanCategory(path) {
        const file = path.split('/').pop().replace(/\.json$/i, '').toLowerCase();
        const singular = file.endsWith('ies') ? `${file.slice(0, -3)}y` : file.replace(/s$/, '');
        for (const key of Object.keys(categoryNames)) {
          if (file === key || singular === key || file.includes(key)) return categoryNames[key];
        }
        return file.replace(/[-_]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()) || 'Other';
      }

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return '';
        const rounded = Math.round(seconds);
        const h = Math.floor(rounded / 3600);
        const m = Math.floor((rounded % 3600) / 60);
        const s = rounded % 60;
        return h ? `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function enrich(category, row) {
        if (category !== 'Research' || row.time !== undefined) return row;
        const points = Number(row.researchPoints ?? row.points ?? row.research_points);
        const power = Number(row.power ?? row.researchPower ?? row.research_power);
        if (Number.isFinite(points) && Number.isFinite(power) && power > 0) return { ...row, time: points / power };
        return row;
      }

      function normalizeJson(path, value) {
        const category = cleanCategory(path);
        let rows = [];
        if (Array.isArray(value)) rows = value;
        else if (value && typeof value === 'object') {
          const array = Object.values(value).find((entry) => Array.isArray(entry));
          if (array) rows = array;
          else rows = Object.entries(value).map(([id, entry]) => entry && typeof entry === 'object' ? { id, ...entry } : { id, value: entry });
        }
        return { category, rows: rows.filter((row) => row && typeof row === 'object').map((row) => enrich(category, row)) };
      }

      async function readFile(file) {
        const result = new Map();
        if (file.name.toLowerCase().endsWith('.json')) {
          const parsed = normalizeJson(file.name, JSON.parse(await file.text()));
          result.set(parsed.category, parsed.rows);
          return result;
        }
        if (!window.JSZip) throw new Error('Archive reader did not load. Check your internet connection and try again.');
        const zip = await JSZip.loadAsync(file);
        const entries = Object.values(zip.files).filter((entry) => !entry.dir && entry.name.toLowerCase().endsWith('.json'));
        if (!entries.length) throw new Error('No JSON stat files were found in this archive.');
        for (const entry of entries) {
          try {
            const parsed = normalizeJson(entry.name, JSON.parse(await entry.async('text')));
            if (!parsed.rows.length) continue;
            result.set(parsed.category, [...(result.get(parsed.category) || []), ...parsed.rows]);
          } catch (error) {
            console.warn(`Skipped ${entry.name}:`, error);
          }
        }
        if (!result.size) throw new Error('JSON files were found, but no table data could be read.');
        return result;
      }

      function identity(row, index) {
        return String(row.id ?? row.ID ?? row.name ?? row.Name ?? row.internalName ?? index);
      }

      function comparable(value) {
        return value && typeof value === 'object' ? JSON.stringify(value) : String(value ?? '');
      }

      function buildRows() {
        const current = currentData.get(activeCategory) || [];
        const base = baselineData.get(activeCategory) || [];
        const currentMap = new Map(current.map((row, index) => [identity(row, index), row]));
        const baseMap = new Map(base.map((row, index) => [identity(row, index), row]));
        const keys = new Set([...currentMap.keys(), ...baseMap.keys()]);
        return [...keys].map((key) => {
          const row = currentMap.get(key);
          const old = baseMap.get(key);
          let delta = 'same';
          if (!old) delta = 'added';
          else if (!row) delta = 'removed';
          else if (JSON.stringify(row) !== JSON.stringify(old)) delta = 'changed';
          return { key, row: row || old, old, delta };
        });
      }

      function displayValue(column, value) {
        if (column === 'time') return formatTime(Number(value));
        if (value && typeof value === 'object') return JSON.stringify(value);
        return String(value ?? '');
      }

      function appendTextCell(tr, column, item) {
        const td = document.createElement('td');
        const value = displayValue(column, item.row[column]);
        const oldValue = item.old ? displayValue(column, item.old[column]) : '';
        if (item.delta === 'changed' && oldValue !== value) {
          const oldSpan = document.createElement('span');
          oldSpan.className = 'old';
          oldSpan.textContent = oldValue;
          const arrow = document.createElement('span');
          arrow.className = 'arrow';
          arrow.textContent = '→';
          const newSpan = document.createElement('span');
          newSpan.className = 'new';
          newSpan.textContent = value;
          td.append(oldSpan, arrow, newSpan);
        } else {
          td.textContent = value;
        }
        tr.appendChild(td);
      }

      function renderTable() {
        const query = search.value.trim().toLowerCase();
        let rows = buildRows();
        if (changesOnly.checked) rows = rows.filter((item) => item.delta !== 'same');
        if (query) rows = rows.filter((item) => JSON.stringify(item.row).toLowerCase().includes(query));
        const preferred = ['id', 'name', 'type', 'price', 'time'];
        const keys = new Set(rows.flatMap((item) => Object.keys(item.row)));
        const columns = [...preferred.filter((key) => keys.has(key)), ...[...keys].filter((key) => !preferred.includes(key)).slice(0, 9)];

        thead.replaceChildren();
        tbody.replaceChildren();
        const headRow = document.createElement('tr');
        columns.forEach((column) => {
          const th = document.createElement('th');
          th.textContent = column === 'time' ? 'Time' : column.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/_/g, ' ').replace(/^\w/, (c) => c.toUpperCase());
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);

        renderedRows = rows;
        rows.forEach((item, index) => {
          const tr = document.createElement('tr');
          tr.className = item.delta;
          tr.dataset.index = index;
          columns.forEach((column) => appendTextCell(tr, column, item));
          tbody.appendChild(tr);
        });
        status.textContent = `${rows.length} item${rows.length === 1 ? '' : 's'} in ${activeCategory}`;
      }

      function renderTabs() {
        const categories = [...new Set([...currentData.keys(), ...baselineData.keys()])].sort();
        if (!categories.includes(activeCategory)) activeCategory = categories[0] || '';
        tabs.replaceChildren();
        categories.forEach((category) => {
          const button = document.createElement('button');
          button.className = `tab${category === activeCategory ? ' active' : ''}`;
          button.type = 'button';
          button.textContent = category;
          button.addEventListener('click', () => {
            activeCategory = category;
            renderTabs();
            renderTable();
          });
          tabs.appendChild(button);
        });
        const loaded = Boolean(currentData.size || baselineData.size);
        empty.style.display = loaded ? 'none' : '';
        tableWrap.style.display = loaded ? 'block' : 'none';
        search.disabled = !loaded;
        changesOnly.disabled = !baselineData.size;
        clearBaseline.disabled = !baselineData.size;
        if (loaded) renderTable();
      }

      async function loadSelected(file, target) {
        if (!file) return;
        status.textContent = `Reading ${file.name}…`;
        status.classList.remove('error');
        try {
          const data = await readFile(file);
          if (target === 'current') {
            currentData = data;
            currentName.textContent = file.name;
          } else {
            baselineData = data;
            baselineName.textContent = file.name;
          }
          renderTabs();
        } catch (error) {
          status.textContent = error.message || 'Unable to read this file.';
          status.classList.add('error');
        }
      }

      function setupDrop(input, zone, target) {
        input.addEventListener('change', () => loadSelected(input.files[0], target));
        ['dragenter', 'dragover'].forEach((eventName) => zone.addEventListener(eventName, (event) => {
          event.preventDefault();
          zone.classList.add('dragging');
        }));
        ['dragleave', 'drop'].forEach((eventName) => zone.addEventListener(eventName, (event) => {
          event.preventDefault();
          zone.classList.remove('dragging');
        }));
        zone.addEventListener('drop', (event) => loadSelected(event.dataTransfer.files[0], target));
      }

      setupDrop(currentFile, $('#currentDrop'), 'current');
      setupDrop(baselineFile, $('#baselineDrop'), 'baseline');
      search.addEventListener('input', renderTable);
      changesOnly.addEventListener('change', renderTable);
      clearBaseline.addEventListener('click', () => {
        baselineData = new Map();
        baselineFile.value = '';
        baselineName.textContent = '';
        changesOnly.checked = false;
        renderTabs();
      });
      tbody.addEventListener('click', (event) => {
        const row = event.target.closest('tr');
        if (!row) return;
        const item = renderedRows[Number(row.dataset.index)];
        if (!item) return;
        detailsTitle.textContent = String(item.row.name ?? item.row.Name ?? item.key);
        detailsJson.textContent = JSON.stringify(item.row, null, 2);
        details.showModal();
      });
      $('#detailsClose').addEventListener('click', () => details.close());
      details.addEventListener('click', (event) => {
        if (event.target === details) details.close();
      });
    })();
  </script>
</body>
</html>
