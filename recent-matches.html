<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warzone 2100 Recent Matches</title>
  <meta
    name="description"
    content="Recent Warzone 2100 matches with replay links, live mirror updates, and leaderboard slice filters."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet"
  >
  <link rel="icon" href="assets/warzone2100-gamehub-logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css?v=20260720-2">
  <style>
    .stats-reset-filters {
      flex: 0 0 auto;
      color: var(--text);
      border-color: rgba(109, 232, 255, 0.28);
    }

    .stats-table-wrap-matches {
      height: min(68vh, 680px);
    }

    .stats-table-wrap-matches .stats-table thead th {
      position: sticky;
      top: 0;
      z-index: 3;
      box-shadow: 0 1px 0 rgba(149, 205, 255, 0.12);
    }

    .stats-matchup-team-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .stats-matchup-team-row .stats-team-strength {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .stats-team-player-link {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: rgba(109, 232, 255, 0.34);
      text-underline-offset: 3px;
    }

    .stats-team-player-link:hover,
    .stats-team-player-link:focus-visible {
      color: var(--cyan);
      text-decoration-color: currentColor;
    }
  </style>
</head>
<body class="embedded-page">
  <div class="page-shell">
    <main id="top">
      <section class="landing-stats stats-shell section-frame">
        <div class="stats-toolbar-row">
          <div class="stats-toolbar" id="statsLeaderboardButtons"></div>
          <button class="stats-filter-button stats-reset-filters" id="statsResetFilters" type="button">Reset filters</button>
          <p class="stats-status" id="resultsStatus" aria-live="polite">Loading mirrored upstream stats...</p>
        </div>

        <section class="stats-panel">
          <div class="stats-panel-head">
            <div>
              <p class="panel-kicker stats-panel-title-main">Recent Matches</p>
            </div>
            <label class="stats-search-field" for="statsMatchesSearch">
              <span class="visually-hidden">Search recent matches by nickname, key, or map</span>
              <input
                id="statsMatchesSearch"
                class="stats-search-input"
                type="search"
                placeholder="Nickname / map"
                autocomplete="off"
                spellcheck="false"
              >
            </label>
          </div>

          <details class="stats-match-filters" id="statsMatchFilters">
            <summary>
              <span>Match filters</span>
              <small id="statsMatchFilterCount">No advanced filters</small>
            </summary>
            <div class="stats-match-filter-grid">
              <label>
                <span>From date</span>
                <input id="statsMatchesDateFrom" type="date">
              </label>
              <label>
                <span>To date</span>
                <input id="statsMatchesDateTo" type="date">
              </label>
              <label>
                <span>Map</span>
                <select id="statsMatchesMap">
                  <option value="">All maps</option>
                </select>
              </label>
              <label>
                <span>Min duration</span>
                <span class="stats-filter-input-unit"><input id="statsMatchesMinDuration" type="number" min="0" step="1" inputmode="numeric" placeholder="0"><small>min</small></span>
              </label>
              <label>
                <span>Max duration</span>
                <span class="stats-filter-input-unit"><input id="statsMatchesMaxDuration" type="number" min="0" step="1" inputmode="numeric" placeholder="Any"><small>min</small></span>
              </label>
              <label>
                <span>Players</span>
                <span class="stats-filter-range"><input id="statsMatchesMinPlayers" type="number" min="1" step="1" inputmode="numeric" placeholder="Min"><b>to</b><input id="statsMatchesMaxPlayers" type="number" min="1" step="1" inputmode="numeric" placeholder="Max"></span>
              </label>
              <label>
                <span>Min power gap</span>
                <span class="stats-filter-input-unit"><input id="statsMatchesMinPowerGap" type="number" min="0" max="100" step="1" inputmode="numeric" placeholder="0"><small>%</small></span>
              </label>
              <label class="stats-filter-check">
                <input id="statsMatchesUpsetsOnly" type="checkbox">
                <span>Upsets only</span>
              </label>
            </div>
          </details>

            <div class="stats-table-wrap stats-table-wrap-matches">
              <table class="stats-table">
                <thead>
                  <tr>
                    <th data-sort-table="matches" data-sort-key="date" aria-sort="descending"><button class="stats-sort-button" type="button">Date</button></th>
                    <th data-sort-table="matches" data-sort-key="map" aria-sort="none"><button class="stats-sort-button" type="button">Map</button></th>
                    <th data-sort-table="matches" data-sort-key="players" aria-sort="none"><button class="stats-sort-button" type="button">Players</button></th>
                    <th data-sort-table="matches" data-sort-key="duration" aria-sort="none"><button class="stats-sort-button" type="button">Duration</button></th>
                    <th data-sort-table="matches" data-sort-key="replay" aria-sort="none"><button class="stats-sort-button" type="button">Replay</button></th>
                  </tr>
                </thead>
                <tbody id="statsMatches">
                  <tr class="stats-skeleton-row" aria-hidden="true">
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                  </tr>
                  <tr class="stats-skeleton-row" aria-hidden="true">
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                  </tr>
                  <tr class="stats-skeleton-row" aria-hidden="true">
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                  </tr>
                  <tr class="stats-skeleton-row" aria-hidden="true">
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="stats-panel-actions" id="statsMatchesActions"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="embedded-page.js?v=20260720-1"></script>
  <script type="module" src="stats/live-stats.js?v=20260720-8"></script>
  <script>
    document.getElementById("statsResetFilters").addEventListener("click", () => {
      window.location.assign(window.location.pathname);
    });
  </script>
</body>
</html>
