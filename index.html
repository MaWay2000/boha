<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warzone 2100 Game Hub</title>
  <meta
    name="description"
    content="A remade Warzone 2100 webstats viewer with leaderboard snapshots, recent matches, open data access, and the Warzone Radio player."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet"
  >
  <link rel="icon" href="assets/warzone2100-gamehub-logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css?v=20260726-1">
  <style>
    body.radio-playlist-open {
      overflow: hidden;
    }

    body.radio-playlist-open .topbar {
      backdrop-filter: none;
    }

    .topbar-radio.is-playlist-overlay::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(2, 7, 12, 0.78);
      backdrop-filter: blur(4px);
    }

    .topbar-radio.is-player-overlay {
      overflow: visible;
      min-height: 168px;
      z-index: 40;
    }

    .topbar-radio iframe.is-player-overlay:not(.is-playlist-overlay) {
      position: absolute;
      right: 8px;
      top: 50%;
      width: min(560px, calc(100vw - 32px));
      transform: translateY(-50%);
    }

    .topbar-radio iframe.is-playlist-overlay {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 1000;
      width: min(520px, calc(100vw - 32px));
      height: min(620px, calc(100vh - 32px));
      min-height: 0;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(122, 192, 255, 0.32);
      border-radius: 24px;
      background: rgba(5, 10, 16, 0.98);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.72);
    }

    body.replay-analyzer-modal-open {
      overflow: hidden;
    }

    .replay-analyzer-modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: grid;
      padding: 14px;
      background: rgba(2, 7, 12, 0.88);
      backdrop-filter: blur(6px);
    }

    .replay-analyzer-modal[hidden] {
      display: none;
    }

    .replay-analyzer-modal-panel {
      position: relative;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      place-self: center;
      overflow: hidden;
      border: 1px solid rgba(109, 232, 255, 0.32);
      border-radius: 22px;
      background: #07131d;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.78);
    }

    .replay-analyzer-modal-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #07131d;
    }

  </style>
</head>
<body>
  <div class="page-shell">
    <div class="page-noise" aria-hidden="true"></div>

    <div class="masthead-band">
      <header class="topbar">
        <a class="brand" href="leaderboards.html" target="contentFrame" data-tab="leaderboards" aria-label="Warzone 2100 Game Hub">
          <img src="assets/warzone2100-gamehub-logo.png" alt="Warzone 2100 logo">
        </a>

        <nav class="topnav" aria-label="Primary">
          <span class="topnav-row topnav-primary">
            <a href="leaderboards.html" target="contentFrame" data-tab="leaderboards" aria-current="page">Leaderboards</a>
            <a href="recent-matches.html" target="contentFrame" data-tab="recent-matches">Recent Matches</a>
            <a href="compare.html" target="contentFrame" data-tab="compare">Compare</a>
            <a href="replay-analyzer.html" target="contentFrame" data-tab="replay-analyzer">Replay Analyzer</a>
          </span>
          <span class="topnav-row topnav-secondary">
            <a href="music-maker.html" target="contentFrame" data-tab="music-maker">Music Maker</a>
            <a href="mapmaker/" target="_blank" rel="noopener noreferrer">Mapmaker</a>
            <a href="mod-viewer/" target="_blank" rel="noopener noreferrer">Mod Viewer</a>
            <a href="model-editor/" target="_blank" rel="noopener noreferrer">3D Model Editor</a>
            <a href="opus2mp3/" target="_blank" rel="noopener noreferrer">Audio Converter</a>
          </span>
          <span class="topnav-actions">
            <a class="discord-link" href="https://discord.gg/9wbtUkGMgf" target="_blank" rel="noreferrer">
              Discord Server
            </a>
            <a class="bohan-hub-link" href="open-data.html" target="contentFrame" data-tab="open-data">Bohan Hub</a>
          </span>
        </nav>

        <div class="topbar-radio" aria-label="Warzone Radio">
          <iframe
            src="radio/"
            title="Warzone Radio"
            loading="eager"
          ></iframe>
        </div>
      </header>
    </div>

    <main class="frame-shell-main" id="top">
      <iframe
        class="content-frame"
        id="contentFrame"
        name="contentFrame"
        title="Warzone 2100 content"
        src="leaderboards.html"
        loading="eager"
      ></iframe>
    </main>

    <footer class="site-footer">
      <p><a href="https://mit-license.org/" target="_blank" rel="noreferrer">MIT License</a>. Warzone 2100 - webstats viewer by Maway2000</p>
    </footer>
  </div>

  <div
    class="replay-analyzer-modal"
    id="replayAnalyzerModal"
    role="dialog"
    aria-modal="true"
    aria-label="Replay analysis"
    hidden
  >
    <div class="replay-analyzer-modal-panel">
      <iframe
        class="replay-analyzer-modal-frame"
        id="replayAnalyzerModalFrame"
        title="Replay Analyzer"
        src="about:blank"
      ></iframe>
    </div>
  </div>

  <script src="shell-frame.js?v=2"></script>
  <script>
    (function () {
      const radioContainer = document.querySelector(".topbar-radio");
      const radioFrame = radioContainer ? radioContainer.querySelector("iframe") : null;

      if (!radioContainer || !radioFrame) {
        return;
      }

      function setPlaylistOverlayOpen(open) {
        document.body.classList.toggle("radio-playlist-open", open);
        radioContainer.classList.toggle("is-playlist-overlay", open);
        radioFrame.classList.toggle("is-playlist-overlay", open);
      }

      function setPlayerOverlayOpen(open) {
        const needsExtraWidth = open && radioContainer.getBoundingClientRect().width < 500;
        radioContainer.classList.toggle("is-player-overlay", needsExtraWidth);
        radioFrame.classList.toggle("is-player-overlay", needsExtraWidth);
      }

      function requestPlaylistClose() {
        radioFrame.contentWindow.postMessage(
          { type: "boha:radio-close-playlist" },
          window.location.origin
        );
      }

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin || event.source !== radioFrame.contentWindow) {
          return;
        }

        if (event.data?.type === "boha:radio-playlist") {
          setPlaylistOverlayOpen(Boolean(event.data.open));
          return;
        }

        if (event.data?.type === "boha:radio-player") {
          setPlayerOverlayOpen(Boolean(event.data.open));
        }
      });

      radioContainer.addEventListener("click", (event) => {
        if (event.target === radioContainer && radioContainer.classList.contains("is-playlist-overlay")) {
          requestPlaylistClose();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && radioContainer.classList.contains("is-playlist-overlay")) {
          requestPlaylistClose();
        }
      });
    }());
  </script>
  <script>
    (function () {
      const contentFrame = document.getElementById("contentFrame");
      const modal = document.getElementById("replayAnalyzerModal");
      const modalFrame = document.getElementById("replayAnalyzerModalFrame");
      let pendingReplayUrl = "";
      let previousFocus = null;

      function closeReplayAnalyzer() {
        modal.hidden = true;
        document.body.classList.remove("replay-analyzer-modal-open");
        pendingReplayUrl = "";
        modalFrame.src = "about:blank";
        if (previousFocus) {
          previousFocus.focus();
        }
      }

      function openReplayAnalyzer(value) {
        let replayUrl;
        try {
          replayUrl = new URL(value);
        } catch (error) {
          return;
        }

        if (replayUrl.protocol !== "http:" && replayUrl.protocol !== "https:") {
          return;
        }

        previousFocus = document.activeElement;
        pendingReplayUrl = replayUrl.href;
        modal.hidden = false;
        document.body.classList.add("replay-analyzer-modal-open");
        modalFrame.src = `replay-analyzer.html?replay=${encodeURIComponent(pendingReplayUrl)}`;
        modalFrame.focus();
      }

      modalFrame.addEventListener("load", () => {
        if (!pendingReplayUrl || modalFrame.src === "about:blank") {
          return;
        }

        const frameDocument = modalFrame.contentDocument;
        if (!frameDocument) {
          return;
        }

        const modalStyles = frameDocument.createElement("style");
        modalStyles.textContent = `
          .replay-analyzer-intro,
          .replay-analyzer-intro + .data-card {
            display: none;
          }

          .replay-summary-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
            align-items: stretch;
            margin-top: 0;
          }

          .replay-summary-grid > .replay-summary-card {
            height: 44px;
            gap: 8px;
            align-items: center;
            padding: 6px 14px;
          }

          .replay-summary-grid .replay-summary-label,
          .replay-summary-grid .replay-summary-value {
            white-space: nowrap;
          }

          .replay-summary-grid .replay-summary-label {
            font-size: 0.68rem;
          }

          .replay-summary-grid .replay-summary-value {
            font-size: 1rem;
            overflow-wrap: normal;
          }

          .replay-results-section:first-of-type > h3 {
            display: none;
          }

          .replay-summary-grid > .replay-analyzer-modal-actions {
            display: flex;
            gap: 8px;
            align-self: center;
          }

          .replay-analyzer-modal-actions > button {
            height: 44px;
            padding: 8px 16px;
            border-radius: 999px;
            cursor: pointer;
            font: 700 0.85rem/1 "Oxanium", sans-serif;
          }

          .replay-analyzer-modal-download {
            min-width: 104px;
            color: #06131b;
            background: var(--cyan);
            border: 1px solid rgba(162, 244, 255, 0.72);
            box-shadow: 0 0 16px rgba(109, 232, 255, 0.2);
          }

          .replay-analyzer-modal-download:hover,
          .replay-analyzer-modal-download:focus-visible {
            background: #a2f4ff;
            outline: none;
          }

          .replay-analyzer-modal-download:disabled {
            cursor: wait;
            opacity: 0.72;
          }

          .replay-analyzer-modal-close {
            min-width: 82px;
            color: #061209;
            background: var(--success);
            border: 1px solid rgba(165, 243, 166, 0.72);
            box-shadow: 0 0 16px rgba(141, 233, 142, 0.2);
          }

          .replay-analyzer-modal-close:hover,
          .replay-analyzer-modal-close:focus-visible {
            background: #a5f3a6;
            outline: none;
          }

          @media (max-width: 900px) {
            .replay-summary-grid {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .replay-summary-grid > .replay-analyzer-modal-actions {
              grid-column: 2;
              justify-self: end;
            }
          }

          @media (max-width: 680px) {
            .replay-summary-grid {
              grid-template-columns: 1fr;
            }

            .replay-summary-grid > .replay-analyzer-modal-actions {
              grid-column: 1;
            }
          }
        `;
        frameDocument.head.append(modalStyles);

        const summaryGrid = frameDocument.getElementById("replaySummary");
        if (summaryGrid) {
          const modalActions = frameDocument.createElement("div");
          modalActions.className = "replay-analyzer-modal-actions";

          const downloadButton = frameDocument.createElement("button");
          downloadButton.className = "replay-analyzer-modal-download";
          downloadButton.type = "button";
          downloadButton.textContent = "Download replay";
          downloadButton.addEventListener("click", async () => {
            const replayUrlToDownload = pendingReplayUrl;
            downloadButton.disabled = true;
            downloadButton.textContent = "Downloading";

            try {
              const response = await fetch(replayUrlToDownload);
              if (!response.ok) {
                throw new Error(`Replay download failed with HTTP ${response.status}.`);
              }

              const replayBlob = await response.blob();
              const blobUrl = URL.createObjectURL(replayBlob);
              const replayPath = new URL(replayUrlToDownload).pathname;
              const downloadLink = frameDocument.createElement("a");
              downloadLink.href = blobUrl;
              downloadLink.download = replayPath.slice(replayPath.lastIndexOf("/") + 1) || "replay.wzrp";
              frameDocument.body.append(downloadLink);
              downloadLink.click();
              downloadLink.remove();
              setTimeout(() => URL.revokeObjectURL(blobUrl), 0);
              downloadButton.textContent = "Downloaded";
            } catch (error) {
              downloadButton.textContent = "Retry";
              downloadButton.title = error.message;
            } finally {
              downloadButton.disabled = false;
            }
          });

          const embeddedCloseButton = frameDocument.createElement("button");
          embeddedCloseButton.className = "replay-analyzer-modal-close";
          embeddedCloseButton.type = "button";
          embeddedCloseButton.setAttribute("aria-label", "Close replay analysis");
          embeddedCloseButton.textContent = "Close";
          embeddedCloseButton.addEventListener("click", closeReplayAnalyzer);
          modalActions.append(downloadButton, embeddedCloseButton);

          const placeModalActions = () => {
            if (summaryGrid.children.length < 4) {
              return false;
            }

            summaryGrid.append(modalActions);
            return true;
          };

          if (!placeModalActions()) {
            const summaryObserver = new modalFrame.contentWindow.MutationObserver(() => {
              if (placeModalActions()) {
                summaryObserver.disconnect();
              }
            });
            summaryObserver.observe(summaryGrid, { childList: true });
          }
        }
      });

      window.addEventListener("message", (event) => {
        if (
          event.origin !== window.location.origin
          || event.source !== contentFrame.contentWindow
          || event.data?.type !== "boha:open-replay-analyzer"
        ) {
          return;
        }

        openReplayAnalyzer(event.data.replayUrl);
      });

      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          closeReplayAnalyzer();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !modal.hidden) {
          closeReplayAnalyzer();
        }
      });
    }());
  </script>
</body>
</html>
