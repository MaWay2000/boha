<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warzone 2100 Leaderboards</title>
  <meta
    name="description"
    content="Warzone 2100 leaderboard snapshot with top players, live mirror updates, and recent match history."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet"
  >
  <link rel="icon" href="assets/warzone2100-gamehub-logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css?v=20260829-search-coal1">
  <style>
    .stats-reset-filters {
      flex: 0 0 auto;
      color: var(--text);
      border-color: rgba(109, 232, 255, 0.28);
    }

    .stats-table-wrap-ranks {
      padding-top: 0;
    }

    .stats-table-wrap-ranks > .stats-table {
      margin-top: 0;
    }

    @media (min-width: 901px) {
      .stats-table-wrap-ranks {
        width: 100%;
      }

      .stats-table-wrap-ranks > .stats-table {
        width: 100%;
        min-width: 720px;
        max-width: none;
      }

      .stats-table-wrap-ranks > .stats-table th:nth-child(2),
      .stats-table-wrap-ranks > .stats-table td:nth-child(2):not([colspan]) {
        width: auto;
        min-width: 0;
        max-width: none;
      }
    }

    @media (min-width: 901px) and (max-width: 1600px) {
      #leaderboards .stats-table th,
      #leaderboards .stats-table td {
        padding: 9px 8px;
      }

      #leaderboards .stats-table th {
        font-size: 0.69rem;
        letter-spacing: 0.08em;
      }

      #leaderboards .stats-table tbody td {
        font-size: 0.8rem;
      }

      #leaderboards .stats-table-wrap-ranks > .stats-table {
        min-width: 100%;
      }

      #leaderboards .stats-table-wrap-ranks > .stats-table th:first-child,
      #leaderboards .stats-table-wrap-ranks > .stats-table td:first-child:not([colspan]) {
        width: 42px;
      }

      #leaderboards .stats-table-wrap-ranks > .stats-table th:nth-child(3),
      #leaderboards .stats-table-wrap-ranks > .stats-table td:nth-child(3):not([colspan]) {
        width: 92px;
      }

      #leaderboards .stats-table-wrap-ranks > .stats-table th:nth-child(4),
      #leaderboards .stats-table-wrap-ranks > .stats-table td:nth-child(4):not([colspan]) {
        width: 64px;
      }

      #leaderboards .stats-table-wrap-ranks > .stats-table th:nth-child(5),
      #leaderboards .stats-table-wrap-ranks > .stats-table td:nth-child(5):not([colspan]) {
        width: 190px;
        min-width: 190px;
        max-width: 190px;
      }

      #leaderboards .stats-player-games-panel .stats-table {
        width: 100%;
        min-width: 0;
        table-layout: fixed;
      }
    }

    .stats-table-ranks thead th {
      position: sticky;
      top: 0;
      z-index: 4;
      box-shadow: 0 1px 0 rgba(149, 205, 255, 0.12);
    }

    .stats-search-field {
      position: relative;
    }

    .stats-summary .stats-search-field {
      box-sizing: border-box;
      width: min(100%, 420px, calc(100vw - 40px));
      min-width: 0;
      max-width: 100%;
      justify-self: start;
    }

    .stats-summary .stats-search-input {
      flex: 1 1 auto;
      width: auto;
      min-width: 0;
      padding-right: 38px;
    }

    .stats-search-input::-webkit-search-cancel-button {
      appearance: none;
    }

    .stats-player-search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      display: inline-grid;
      width: 32px;
      height: 28px;
      padding: 0;
      place-items: center;
      border: 1px solid rgba(255, 213, 106, 0.62);
      border-radius: 4px 14px 14px 4px;
      color: #ffd56a;
      background: linear-gradient(180deg, rgba(58, 45, 15, 0.98), rgba(27, 22, 11, 0.98));
      box-shadow:
        inset 1px 0 0 rgba(255, 232, 160, 0.08),
        0 0 10px rgba(255, 213, 106, 0.12);
      cursor: pointer;
      font: 700 0.9rem/1 "Oxanium", sans-serif;
      transform: translateY(-50%);
      transition:
        color 140ms ease,
        border-color 140ms ease,
        background-color 140ms ease,
        box-shadow 140ms ease;
    }

    .stats-player-search-clear:hover,
    .stats-player-search-clear:focus-visible {
      color: #fff4cf;
      border-color: #ffd56a;
      outline: none;
      background: rgba(92, 68, 16, 0.9);
      box-shadow: 0 0 12px rgba(255, 213, 106, 0.28);
    }

    .stats-player-search-clear[hidden] {
      display: inline-grid;
      opacity: 0.38;
      pointer-events: none;
    }

    .stats-panel-head-ranks .stats-panel-copy {
      position: relative;
      isolation: isolate;
      display: flex;
      width: clamp(188px, 18vw, 220px);
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 2px 13px;
      background: linear-gradient(180deg, #86f1ff, #0a8db7 46%, #004962 100%);
      clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0 50%);
      filter: drop-shadow(0 0 7px rgba(70, 220, 255, 0.32));
    }

    .stats-panel-head-ranks {
      position: relative;
      justify-content: flex-start;
    }

    .stats-games-filter-menu {
      position: static;
    }

    .stats-trending-filter-menu {
      position: static;
    }

    .stats-games-filter-popup {
      box-sizing: border-box;
      width: 100%;
      min-height: 286px;
    }

    .stats-games-filter-popup .stats-toolbar {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-content: start;
      gap: 8px;
    }

    .stats-games-filter-popup .stats-filter-button {
      width: 100%;
      min-height: 46px;
      padding: 7px 12px;
      line-height: 1.15;
      white-space: normal;
    }

    .stats-trending-filter-menu .stats-trending-popup {
      box-sizing: border-box;
      width: 100%;
      min-height: 400px;
    }

    .stats-trending-filter-menu .stats-trending-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: start;
      gap: 10px;
    }

    .stats-trending-filter-menu .stats-trending-card {
      min-height: 108px;
      box-sizing: border-box;
    }

    @media (max-width: 720px) {
      .stats-games-filter-popup .stats-toolbar {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 460px) {
      .stats-games-filter-popup .stats-toolbar {
        grid-template-columns: 1fr;
      }

      .stats-trending-filter-menu .stats-trending-grid {
        grid-template-columns: 1fr;
      }
    }

    .stats-panel-head-ranks .stats-panel-copy::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 2px 10px;
      background:
        radial-gradient(circle at 50% 0, rgba(75, 222, 255, 0.16), transparent 48%),
        linear-gradient(180deg, #0b2638 0%, #020b13 58%, #061722 100%);
      clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0 50%);
      box-shadow:
        inset 0 1px 0 rgba(210, 250, 255, 0.22),
        inset 0 -2px 0 rgba(0, 111, 151, 0.42);
    }

    .stats-panel-head-ranks .stats-panel-copy::after {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 18px;
      height: 8px;
      background: linear-gradient(135deg, transparent 44%, #73eaff 45% 55%, transparent 56%);
      transform: translate(-50%, -1px);
      filter: drop-shadow(0 0 4px rgba(91, 233, 255, 0.8));
    }

    .stats-panel-head-ranks .stats-panel-title-main {
      position: relative;
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #e4fbff;
      font: 800 0.94rem/1 "Oxanium", sans-serif;
      letter-spacing: 0.12em;
      text-align: center;
      text-shadow:
        0 0 7px rgba(91, 233, 255, 0.72),
        0 1px 0 #000;
      white-space: nowrap;
    }

    .stats-panel-head-ranks .stats-panel-title-main::before,
    .stats-panel-head-ranks .stats-panel-title-main::after {
      content: "";
      width: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #64e6ff);
      box-shadow: 0 0 5px rgba(91, 233, 255, 0.75);
    }

    .stats-panel-head-ranks .stats-panel-title-main::after {
      background: linear-gradient(90deg, #64e6ff, transparent);
    }

    .stats-profile-compare-link {
      position: relative;
    }

    .stats-profile-details article:has(.stats-profile-compare-link) {
      z-index: 2;
      overflow: visible;
      clip-path: none;
    }

    .stats-profile-details article:has(.stats-profile-compare-link:hover),
    .stats-profile-details article:has(.stats-profile-compare-link:focus-visible) {
      z-index: 5;
    }

    .stats-profile-link-hint {
      position: absolute;
      left: 0;
      bottom: calc(100% + 10px);
      z-index: 12;
      width: max-content;
      max-width: min(320px, calc(100vw - 40px));
      padding: 7px 10px;
      border: 1px solid rgba(109, 232, 255, 0.48);
      border-radius: 6px;
      color: #e7f8fb;
      background: rgba(4, 16, 25, 0.98);
      box-shadow:
        0 12px 26px rgba(0, 0, 0, 0.42),
        0 0 12px rgba(109, 232, 255, 0.2);
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 1.25;
      text-align: left;
      white-space: normal;
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition:
        opacity 180ms ease,
        transform 180ms ease;
    }

    .stats-profile-link-hint::before {
      content: "";
      position: absolute;
      bottom: -5px;
      left: 20px;
      width: 8px;
      height: 8px;
      border-right: 1px solid rgba(109, 232, 255, 0.48);
      border-bottom: 1px solid rgba(109, 232, 255, 0.48);
      background: rgba(4, 16, 25, 0.98);
      transform: rotate(45deg);
    }

    .stats-profile-compare-link:hover .stats-profile-link-hint,
    .stats-profile-compare-link:focus-visible .stats-profile-link-hint {
      opacity: 1;
      transform: translateY(0);
    }

    #leaderboards .stats-grid > .stats-panel {
      border-color: transparent;
      background: transparent;
      clip-path: none;
      box-shadow: none;
    }

    #leaderboards .stats-grid > .stats-panel::before {
      display: none;
    }

  </style>
</head>
<body class="embedded-page">
  <div class="page-shell">
    <main id="top">
      <section class="landing-stats stats-shell section-frame" id="leaderboards">
        <div class="stats-toolbar-row">
          <p class="stats-status" id="resultsStatus" aria-live="polite">Loading mirrored upstream stats...</p>
        </div>

        <div class="stats-grid">
          <div class="stats-summary" id="statsSummary">
            <article class="stats-card">
              <span class="stats-card-label">Matches</span>
              <strong class="stats-card-value"><span class="stats-skeleton stats-skeleton-line stats-skeleton-medium"></span></strong>
            </article>
            <article class="stats-card">
              <span class="stats-card-label">Ranked Players</span>
              <strong class="stats-card-value"><span class="stats-skeleton stats-skeleton-line stats-skeleton-medium"></span></strong>
            </article>
            <article class="stats-card">
              <span class="stats-card-label">Latest Match</span>
              <strong class="stats-card-value"><span class="stats-skeleton stats-skeleton-line stats-skeleton-medium"></span></strong>
            </article>
            <article class="stats-card">
              <span class="stats-card-label">Last Updated</span>
              <strong class="stats-card-value"><span class="stats-skeleton stats-skeleton-line stats-skeleton-medium"></span></strong>
            </article>
          </div>

          <section class="stats-panel">
            <div class="stats-panel-head stats-panel-head-ranks">
              <div class="stats-panel-copy">
                <p class="panel-kicker stats-panel-title-main">Top Players</p>
              </div>
              <details class="stats-leaderboard-filter-menu stats-games-filter-menu" name="player-header-menu">
                <summary class="stats-filter-button">Games filter</summary>
                <div class="stats-leaderboard-filter-popup stats-games-filter-popup">
                  <div class="stats-toolbar" id="statsLeaderboardButtons"></div>
                </div>
              </details>
              <details class="stats-leaderboard-filter-menu stats-trending-filter-menu" name="player-header-menu">
                <summary class="stats-filter-button">Trending</summary>
                <div class="stats-leaderboard-filter-popup stats-trending-popup">
                  <section class="stats-trending-players" id="statsTrendingPlayers"></section>
                </div>
              </details>
              <label class="stats-search-field" for="statsPlayerSearch">
                <span class="stats-search-label" aria-hidden="true">Player search:</span>
                <span class="visually-hidden">Search top players by nickname or key</span>
                <input
                  id="statsPlayerSearch"
                  class="stats-search-input"
                  type="search"
                  placeholder="Nickname / key"
                  autocomplete="off"
                  spellcheck="false"
                >
                <button
                  class="stats-player-search-clear"
                  id="statsPlayerSearchClear"
                  type="button"
                  aria-label="Clear player search"
                  title="Clear player search"
                  hidden
                >&times;</button>
              </label>
            </div>

            <div class="stats-table-wrap stats-table-wrap-ranks">
              <table class="stats-table stats-table-ranks">
                <thead>
                  <tr>
                    <th data-sort-table="ranks" data-sort-key="rank" aria-sort="ascending"><button class="stats-sort-button" type="button">#</button></th>
                    <th data-sort-table="ranks" data-sort-key="player" aria-sort="none"><button class="stats-sort-button" type="button">Player</button></th>
                    <th data-sort-table="ranks" data-sort-key="elo" aria-sort="none"><button class="stats-sort-button" type="button">Elo</button></th>
                    <th data-sort-table="ranks" data-sort-key="matches" aria-sort="none"><button class="stats-sort-button" type="button">Games</button></th>
                    <th class="stats-record-sort-head">
                      <div class="stats-record-sort-group stats-record-grid" aria-label="Sort by wins, losses, draws, crashes, or percentages">
                        <span class="stats-record-metric">
                          <button class="stats-sort-button stats-sort-button-compact" type="button" data-sort-table="ranks" data-sort-key="wins" aria-label="Sort by wins">
                            Win
                            <span class="stats-sort-hint" aria-hidden="true">Wins</span>
                          </button>
                          <button class="stats-sort-button stats-sort-button-compact stats-sort-button-percent" type="button" data-sort-table="ranks" data-sort-key="winRate" aria-label="Sort by win percentage (minimum 10 games)">
                            %
                            <span class="stats-sort-hint" aria-hidden="true">Win percentage</span>
                          </button>
                        </span>
                        <span class="stats-record-sort-divider">/</span>
                        <span class="stats-record-metric">
                          <button class="stats-sort-button stats-sort-button-compact" type="button" data-sort-table="ranks" data-sort-key="losses" aria-label="Sort by losses">
                            Lost
                            <span class="stats-sort-hint" aria-hidden="true">Losses</span>
                          </button>
                          <button class="stats-sort-button stats-sort-button-compact stats-sort-button-percent" type="button" data-sort-table="ranks" data-sort-key="lossRate" aria-label="Sort by loss percentage (minimum 10 games)">
                            %
                            <span class="stats-sort-hint" aria-hidden="true">Loss percentage</span>
                          </button>
                        </span>
                        <span class="stats-record-sort-divider">/</span>
                        <span class="stats-record-metric">
                          <button class="stats-sort-button stats-sort-button-compact" type="button" data-sort-table="ranks" data-sort-key="draws" aria-label="Sort by draws">
                            Draw&nbsp;
                            <span class="stats-sort-hint" aria-hidden="true">Draws</span>
                          </button>
                          <button class="stats-sort-button stats-sort-button-compact stats-sort-button-percent" type="button" data-sort-table="ranks" data-sort-key="drawRate" aria-label="Sort by draw percentage (minimum 10 games)">
                            %
                            <span class="stats-sort-hint" aria-hidden="true">Draw percentage</span>
                          </button>
                        </span>
                        <span class="stats-record-sort-divider">/</span>
                        <span class="stats-record-metric">
                          <button class="stats-sort-button stats-sort-button-compact" type="button" data-sort-table="ranks" data-sort-key="crashes" aria-label="Sort by crashed all-loser games">
                            X
                            <span class="stats-sort-hint" aria-hidden="true">Crashes</span>
                          </button>
                          <button class="stats-sort-button stats-sort-button-compact stats-sort-button-percent" type="button" data-sort-table="ranks" data-sort-key="crashRate" aria-label="Sort by crash percentage (minimum 10 games)">
                            %
                            <span class="stats-sort-hint" aria-hidden="true">Crash percentage</span>
                          </button>
                        </span>
                      </div>
                    </th>
                  </tr>
                </thead>
                <tbody id="statsRanks">
                  <tr class="stats-skeleton-row" aria-hidden="true">
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-medium"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-medium"></span></td>
                  </tr>
                  <tr class="stats-skeleton-row" aria-hidden="true">
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-medium"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-medium"></span></td>
                  </tr>
                  <tr class="stats-skeleton-row" aria-hidden="true">
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-medium"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-medium"></span></td>
                  </tr>
                  <tr class="stats-skeleton-row" aria-hidden="true">
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-medium"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-medium"></span></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="stats-panel-actions" id="statsRanksActions"></div>
          </section>

          <section class="stats-panel stats-player-games-panel">
            <div class="stats-panel-head">
              <div class="stats-player-profile-heading-line">
                <p class="panel-kicker">Player Profile</p>
                <h4 id="statsPlayerGamesTitle">Select a player to open their profile</h4>
                <button class="stats-profile-share" id="statsProfileShare" type="button" hidden>Copy profile link</button>
              </div>
              <span class="stats-panel-note" id="statsPlayerGamesMeta">The selected player's latest matches will appear here.</span>
            </div>

            <section class="stats-player-profile" id="statsPlayerProfile" hidden></section>

            <p class="stats-detail-label stats-profile-recent-label">Recent matches</p>
            <div class="stats-table-wrap">
              <table class="stats-table">
                <thead>
                  <tr>
                    <th data-sort-table="player-games" data-sort-key="date" aria-sort="descending"><button class="stats-sort-button" type="button">Date</button></th>
                    <th data-sort-table="player-games" data-sort-key="map" aria-sort="none"><button class="stats-sort-button" type="button">Map</button></th>
                    <th data-sort-table="player-games" data-sort-key="result" aria-sort="none"><button class="stats-sort-button" type="button">Result</button></th>
                    <th data-player-games-elo-header>Elo</th>
                    <th data-sort-table="player-games" data-sort-key="duration" aria-sort="none"><button class="stats-sort-button" type="button">Duration</button></th>
                    <th data-sort-table="player-games" data-sort-key="replay" aria-sort="none"><button class="stats-sort-button" type="button">Replay</button></th>
                  </tr>
                </thead>
                <tbody id="statsPlayerGames">
                  <tr class="stats-skeleton-row" aria-hidden="true">
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                  </tr>
                  <tr class="stats-skeleton-row" aria-hidden="true">
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                  </tr>
                  <tr class="stats-skeleton-row" aria-hidden="true">
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                    <td><span class="stats-skeleton stats-skeleton-line stats-skeleton-short"></span></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="stats-panel-actions" id="statsPlayerGamesActions"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="embedded-page.js?v=20260720-1"></script>
  <script type="module" src="stats/live-stats.js?v=20260828-4"></script>
</body>
</html>
