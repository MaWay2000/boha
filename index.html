    }

    .topbar-radio.is-playlist-overlay::before {

    }

    .topbar-radio iframe.is-player-overlay:not(.is-playlist-overlay) {
      position: absolute;
      right: 8px;
      top: 50%;
      width: min(560px, calc(100vw - 32px));
      transform: translateY(-50%);
    }

    .topbar-radio iframe.is-playlist-overlay {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 1000;
      width: min(600px, calc(100vw - 32px)) !important;
      height: min(620px, calc(100vh - 32px));
      min-height: 0;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(122, 192, 255, 0.32);

    @media (min-width: 1081px) {
      .site-app-shell .topbar {
        grid-template-columns: clamp(300px, 22vw, 430px) minmax(0, 1fr) 160px;
      }
    }

    .site-app-shell .topbar-radio {
      width: 160px;
      min-width: 160px;
      justify-self: end;
      align-self: center;
      padding: 0;
      overflow: visible;
      opacity: 1;
    }

    .site-app-shell .topbar-radio iframe {
      width: 160px;
      background: transparent;
    }

    @media (max-width: 820px) {
      .site-app-shell .topbar-radio {
        width: 160px;
        min-width: 160px;
        justify-self: end;
      }
    }

    body.replay-analyzer-modal-open {
      overflow: hidden;
    }

    .replay-analyzer-modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: grid;
      padding: 0;
      background: rgba(2, 7, 12, 0.88);
      backdrop-filter: blur(6px);
    }

    .replay-analyzer-modal[hidden] {
      display: none;
    }

    .replay-analyzer-modal-panel {
      position: relative;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      place-self: center;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: transparent;
      clip-path: none;
      box-shadow: none;
    }

    .replay-analyzer-modal-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #07131d;
    }

  </style>
</head>

  <script>
    (function () {
      const endpoint = "https://onit.lt/wzstats/api/v1/visitors";
      let referrer = "";
      try {
        referrer = document.referrer ? new URL(document.referrer).origin : "";
      } catch (error) {
        referrer = "";
      }

      fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          path: window.location.pathname,
          referrer: referrer
        }),
        cache: "no-store",
        credentials: "omit",
        keepalive: true
      }).then(async function (response) {
        if (response.status !== 403) {
          return;
        }
        const payload = await response.json().catch(function () { return {}; });
        if (!payload.blocked) {
          return;
        }

        window.stop();
        document.title = "Access blocked";
        document.body.innerHTML =
          '<main role="main" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#07111c;color:#eef8ff;font-family:Arial,sans-serif;text-align:center">' +
            '<section><h1 style="margin:0 0 12px;font-size:2rem">Access blocked</h1>' +
            '<p style="margin:0;color:#9eb6c9">You do not have permission to access this website.</p></section>' +
          '</main>';
      }).catch(function () {
        // Fail open when the logging service is temporarily unavailable.
      });
    })();
  </script>
  <script src="shell-frame.js?v=2"></script>
  <script>
    (function () {
      const radioContainer = document.querySelector(".topbar-radio");
      const radioFrame = radioContainer ? radioContainer.querySelector("iframe") : null;

      if (!radioContainer || !radioFrame) {
        return;
      }

      function setPlaylistOverlayOpen(open) {
        document.body.classList.toggle("radio-playlist-open", open);
        radioContainer.classList.toggle("is-playlist-overlay", open);
        radioFrame.classList.toggle("is-playlist-overlay", open);
      }

      function setPlayerOverlayOpen(open) {
        const needsExtraWidth = open && radioContainer.getBoundingClientRect().width < 500;
        radioContainer.classList.toggle("is-player-overlay", needsExtraWidth);
        radioFrame.classList.toggle("is-player-overlay", needsExtraWidth);
      }

      function requestPlaylistClose() {
        radioFrame.contentWindow.postMessage(
          { type: "boha:radio-close-playlist" },
          window.location.origin
        );
      }

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin || event.source !== radioFrame.contentWindow) {
          return;
        }

        if (event.data?.type === "boha:radio-playlist") {
          setPlaylistOverlayOpen(Boolean(event.data.open));
          return;
        }

        if (event.data?.type === "boha:radio-player") {
          setPlayerOverlayOpen(Boolean(event.data.open));
        }
      });

      radioContainer.addEventListener("click", (event) => {
        if (event.target === radioContainer && radioContainer.classList.contains("is-playlist-overlay")) {
          requestPlaylistClose();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && radioContainer.classList.contains("is-playlist-overlay")) {
          requestPlaylistClose();
        }
      });
    }());
  </script>
  <script>
    (function () {
      const contentFrame = document.getElementById("contentFrame");
      const modal = document.getElementById("replayAnalyzerModal");
      const modalFrame = document.getElementById("replayAnalyzerModalFrame");
      let pendingReplayUrl = "";
      let pendingReplaySource = { label: "", url: "" };
      let previousFocus = null;

      function sourceUrlForLabel(label, explicitUrl = "", replayUrl = "") {
        const safeHttpUrl = (value) => {
          if (!value) {
            return "";
          }
          try {
            const url = new URL(value, window.location.href);
            return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
          } catch (error) {
            return "";
          }
        };

        const linkedUrl = safeHttpUrl(explicitUrl);
        if (linkedUrl) {
          return linkedUrl;
        }

        if (/Bohan|Retropaganda/i.test(label)) {
          return "https://warzone2100.retropaganda.info/";
        }
        const domain = label.match(/(?:https?:\/\/)?((?:[a-z0-9-]+\.)+[a-z]{2,})(?:\/[^\s]*)?/i)?.[1];
        if (domain) {
          return `https://${domain}/`;
        }

        const replaySource = safeHttpUrl(replayUrl);
        return replaySource ? new URL(replaySource).origin + "/" : "";
      }

      function closeReplayAnalyzer() {
        modal.hidden = true;
        document.body.classList.remove("replay-analyzer-modal-open");
        pendingReplayUrl = "";
        pendingReplaySource = { label: "", url: "" };
        modalFrame.src = "about:blank";
        if (previousFocus) {
          previousFocus.focus();
        }
      }

      function replaySourceForUrl(value) {
        const frameDocument = contentFrame.contentDocument;
        if (!frameDocument) {
          return "";
        }

        const replayLink = Array.from(
          frameDocument.querySelectorAll(".stats-replay-link[data-replay-analyzer-url]")
        ).find((link) => link.dataset.replayAnalyzerUrl === value);
        const sourceElement = replayLink?.closest("tr")?.querySelector(".stats-note");
        const sourceLink = sourceElement?.closest("a[href]") || sourceElement?.querySelector("a[href]");
        return {
          label: sourceElement?.textContent.trim() || "",
          url: sourceLink?.href || ""
        };
      }

      function openReplayAnalyzer(value, source = "") {
        let replayUrl;
        try {
          replayUrl = new URL(value);
        } catch (error) {
          return;
        }

        if (replayUrl.protocol !== "http:" && replayUrl.protocol !== "https:") {
          return;
        }

        previousFocus = document.activeElement;
        pendingReplayUrl = replayUrl.href;
        const sourceLabel = typeof source === "string" ? source : source?.label || "";
        const sourceUrl = typeof source === "object" ? source?.url || "" : "";
        pendingReplaySource = {
          label: sourceLabel,
          url: sourceUrlForLabel(sourceLabel, sourceUrl, replayUrl.href)
        };
        modal.hidden = false;
        document.body.classList.add("replay-analyzer-modal-open");
        modalFrame.src = `replay-analyzer.html?v=20260824-47&replay=${encodeURIComponent(pendingReplayUrl)}`;
        modalFrame.focus();
      }

      modalFrame.addEventListener("load", () => {
        if (!pendingReplayUrl || modalFrame.src === "about:blank") {
          return;
        }

        const frameDocument = modalFrame.contentDocument;
        if (!frameDocument) {
          return;
        }

        const modalStyles = frameDocument.createElement("style");
        modalStyles.textContent = `
          .page-shell {
            padding-top: 0;
          }

          .replay-analyzer-intro,
          .replay-analyzer-intro + .data-card {
            display: none;
          }

          .replay-summary-grid {
            position: sticky;
            top: 0;
            z-index: 100;
            grid-template-columns: repeat(5, minmax(0, 1fr)) auto;
            align-items: stretch;
            margin-top: 0;
            margin-inline: -16px;
            width: calc(100% + 32px);
            padding: 4px 0;
            background:
              radial-gradient(circle at 15% 0, rgba(20, 177, 220, 0.13), transparent 34%),
              linear-gradient(180deg, rgba(7, 25, 39, 0.96), rgba(1, 8, 15, 0.98));
            border: 1px solid rgba(56, 218, 255, 0.5);
            border-radius: 2px;
            clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
            box-shadow:
              inset 0 1px 0 rgba(166, 244, 255, 0.16),
              inset 0 -2px 0 rgba(0, 130, 177, 0.2),
              0 8px 20px rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(8px);
          }

          .replay-summary-grid > .replay-summary-card {
            height: 22px;
            gap: 6px;
            align-items: center;
            padding: 2px 10px;
            background: linear-gradient(180deg, rgba(15, 44, 61, 0.9), rgba(3, 12, 21, 0.96));
            border-color: rgba(62, 220, 255, 0.38);
            border-radius: 2px;
            clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 5px, 100% calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%, 0 calc(100% - 5px), 0 5px);
            box-shadow:
              inset 0 1px 0 rgba(176, 246, 255, 0.16),
              inset 0 -1px 0 rgba(0, 126, 169, 0.26);
          }

          .replay-summary-grid .replay-summary-label,
          .replay-summary-grid .replay-summary-value {
            white-space: nowrap;
          }

          .replay-summary-grid .replay-summary-label {
            font-size: 0.68rem;
          }

          .replay-summary-grid .replay-summary-value {
            font-size: 1rem;
            overflow-wrap: normal;
          }

          .replay-summary-source-link {
            color: inherit;
            text-decoration: underline;
            text-decoration-color: rgba(109, 232, 255, 0.54);
            text-underline-offset: 2px;
          }

          .replay-summary-source-link:hover,
          .replay-summary-source-link:focus-visible {
            color: #9cefff;
            text-decoration-color: currentColor;
            outline: none;
            text-shadow: 0 0 8px rgba(109, 232, 255, 0.44);
          }

          .replay-results-section:first-of-type > h3 {
            display: none;
          }

          .replay-summary-grid > .replay-analyzer-modal-actions {
            display: flex;
            gap: 8px;
            align-self: center;
          }

          .replay-analyzer-modal-actions > button {
            height: 22px;
            padding: 3px 12px;
            border-radius: 2px;
            clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 5px, 100% calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%, 0 calc(100% - 5px), 0 5px);
            cursor: pointer;
            font: 700 0.7rem/1 "Oxanium", sans-serif;
            letter-spacing: 0.06em;
            text-shadow: 0 0 8px currentColor;
            text-transform: uppercase;
            transition: filter 140ms ease, box-shadow 140ms ease, transform 140ms ease;
          }

          .replay-analyzer-modal-download {
            min-width: 104px;
            color: #dffbff;
            background:
              linear-gradient(180deg, rgba(37, 155, 187, 0.98), rgba(5, 54, 72, 0.98) 58%, rgba(2, 24, 35, 0.99));
            border: 1px solid rgba(113, 234, 255, 0.88);
            box-shadow:
              inset 0 1px 0 rgba(222, 252, 255, 0.38),
              inset 0 -2px 0 rgba(0, 10, 18, 0.48),
              0 0 14px rgba(64, 221, 255, 0.28);
          }

          .replay-analyzer-modal-download:hover,
          .replay-analyzer-modal-download:focus-visible {
            filter: brightness(1.24);
            box-shadow:
              inset 0 1px 0 rgba(235, 254, 255, 0.5),
              inset 0 -2px 0 rgba(0, 10, 18, 0.48),
              0 0 20px rgba(64, 221, 255, 0.5);
            outline: none;
            transform: translateY(-1px);
          }

          .replay-analyzer-modal-download:disabled {
            cursor: wait;
            opacity: 0.72;
          }

          .replay-analyzer-modal-close {
            min-width: 82px;
            color: #e8ffe9;
            background:
              linear-gradient(180deg, rgba(75, 174, 88, 0.98), rgba(18, 82, 35, 0.98) 58%, rgba(5, 35, 17, 0.99));
            border: 1px solid rgba(154, 245, 163, 0.86);
            box-shadow:
              inset 0 1px 0 rgba(229, 255, 231, 0.36),
              inset 0 -2px 0 rgba(1, 18, 7, 0.5),
              0 0 14px rgba(102, 233, 115, 0.24);
          }

          .replay-analyzer-modal-close:hover,
          .replay-analyzer-modal-close:focus-visible {
            filter: brightness(1.24);
            box-shadow:
              inset 0 1px 0 rgba(239, 255, 241, 0.5),
              inset 0 -2px 0 rgba(1, 18, 7, 0.5),
              0 0 20px rgba(102, 233, 115, 0.46);
            outline: none;
            transform: translateY(-1px);
          }

          @media (max-width: 900px) {
            .replay-summary-grid {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .replay-summary-grid > .replay-analyzer-modal-actions {
              grid-column: 2;
              justify-self: end;
            }
          }

          @media (max-width: 680px) {
            .replay-summary-grid {
              grid-template-columns: 1fr;
            }

            .replay-summary-grid > .replay-analyzer-modal-actions {
              grid-column: 1;
            }
          }

          @media (max-width: 820px) {
            .replay-summary-grid {
              margin-inline: -10px;
              width: calc(100% + 20px);
            }
          }
        `;
        frameDocument.head.append(modalStyles);

        const summaryGrid = frameDocument.getElementById("replaySummary");
        if (summaryGrid) {
          const modalActions = frameDocument.createElement("div");
          modalActions.className = "replay-analyzer-modal-actions";

          const downloadButton = frameDocument.createElement("button");
          downloadButton.className = "replay-analyzer-modal-download";
          downloadButton.type = "button";
          downloadButton.textContent = "Download replay";
          downloadButton.addEventListener("click", async () => {
            const replayUrlToDownload = pendingReplayUrl;
            downloadButton.disabled = true;
            downloadButton.textContent = "Downloading";

            try {
              const response = await fetch(replayUrlToDownload);
              if (!response.ok) {
                throw new Error(`Replay download failed with HTTP ${response.status}.`);
              }

              const replayBlob = await response.blob();
              const blobUrl = URL.createObjectURL(replayBlob);
              const replayPath = new URL(replayUrlToDownload).pathname;
              const downloadLink = frameDocument.createElement("a");
              downloadLink.href = blobUrl;
              downloadLink.download = replayPath.slice(replayPath.lastIndexOf("/") + 1) || "replay.wzrp";
              frameDocument.body.append(downloadLink);
              downloadLink.click();
              downloadLink.remove();
              setTimeout(() => URL.revokeObjectURL(blobUrl), 0);
              downloadButton.textContent = "Downloaded";
            } catch (error) {
              downloadButton.textContent = "Retry";
              downloadButton.title = error.message;
            } finally {
              downloadButton.disabled = false;
            }
          });

          const embeddedCloseButton = frameDocument.createElement("button");
          embeddedCloseButton.className = "replay-analyzer-modal-close";
          embeddedCloseButton.type = "button";
          embeddedCloseButton.setAttribute("aria-label", "Close replay analysis");
          embeddedCloseButton.textContent = "Close";
          embeddedCloseButton.addEventListener("click", closeReplayAnalyzer);
          modalActions.append(downloadButton, embeddedCloseButton);

          const placeModalActions = () => {
            if (summaryGrid.children.length < 4) {
              return false;
            }

            const sourceCard = Array.from(
              summaryGrid.querySelectorAll(".replay-summary-card")
            ).find((card) => card.querySelector(".replay-summary-label")?.textContent === "Host");
            if (sourceCard) {
              sourceCard.querySelector(".replay-summary-label").textContent = "Source";
              const sourceValue = sourceCard.querySelector(".replay-summary-value");
              const sourceText = pendingReplaySource.label || "Unknown";
              sourceValue.textContent = sourceText;
              if (sourceText !== "Unknown" && pendingReplaySource.url) {
                const sourceLink = frameDocument.createElement("a");
                sourceLink.className = "replay-summary-source-link";
                sourceLink.href = pendingReplaySource.url;
                sourceLink.target = "_blank";
                sourceLink.rel = "noopener noreferrer";
                sourceLink.textContent = sourceText;
                sourceValue.replaceChildren(sourceLink);
              }
            }

            const dateCard = Array.from(
              summaryGrid.querySelectorAll(".replay-summary-card")
            ).find((card) => card.querySelector(".replay-summary-label")?.textContent === "Date");
            if (dateCard) {
              summaryGrid.prepend(dateCard);
            }

            summaryGrid.append(modalActions);
            return true;
          };

          if (!placeModalActions()) {
            const summaryObserver = new modalFrame.contentWindow.MutationObserver(() => {
              if (placeModalActions()) {
                summaryObserver.disconnect();
              }
            });
            summaryObserver.observe(summaryGrid, { childList: true });
          }
        }
      });

      window.addEventListener("message", (event) => {
        if (
          event.origin !== window.location.origin
          || event.source !== contentFrame.contentWindow
          || event.data?.type !== "boha:open-replay-analyzer"
        ) {
          return;
        }

        openReplayAnalyzer(event.data.replayUrl, replaySourceForUrl(event.data.replayUrl));
      });

      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          closeReplayAnalyzer();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !modal.hidden) {
          closeReplayAnalyzer();
        }
      });
    }());
  </script>
