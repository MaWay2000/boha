name: Publish Arc Mod leaderboards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-wavehoster.yml'
      - 'stats/wavehoster-publication.cjs'
      - 'stats/wavehoster-publication.test.cjs'
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
permissions:
  contents: write
concurrency:
  group: sync-wavehoster
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test stats/wavehoster-publication.test.cjs tests/wavehoster-data.test.mjs
      - name: Download privacy-filtered Arc Mod results
        run: node stats/wavehoster-publication.cjs
      - name: Check public release
        run: node stats/check-public-release.cjs
      - name: Publish changed results
        run: |
          if git diff --quiet -- stats/published/wavehoster.json; then
            echo 'Arc Mod results unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats/published/wavehoster.json
          git commit -m 'Update Arc Mod leaderboards'
          git pull --rebase origin main
          git push
